kind = "web"
previewPath = "/"
title = "SAND Study Game"
version = "1.0.0"
id = "artifacts/sand-study"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20956

[services.development]
run = "pnpm --filter @workspace/sand-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sand-study", "run", "build" ]
publicDir = "artifacts/sand-study/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20956"
BASE_PATH = "/"
